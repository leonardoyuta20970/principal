<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bienvenida</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;

            /* Imagen de fondo */
            background: url('https://leonardoyuta20970.github.io/principal//Docentes2026.jpeg') no-repeat center center/cover;
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            color: white;
            text-align: center;
        }

        /* Capa oscura para mejorar visibilidad */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0,0.5);
            z-index: 0;
        }

        .logo {
            position: absolute; /* o fixed */
            top: 20px;
            left: 28px;

            width: 140px; /* ajusta tamaño */
            z-index: 10;
        }

        .contenido {
            position: absolute;
            top: 50%;   /* 👈 inicia desde la mitad */
            left: 50%;
            transform: translateX(-50%); /* 👈 SOLO centrado horizontal */

            text-align: center;
        }

        h1 {
            font-size: 70px; /* 👈 más grande */
            color: white;
            margin: 0;

            text-shadow:
                0 0 5px rgba(255, 215, 0, 0.9),
                0 0 10px rgba(255, 215, 0, 0.8),
                0 0 20px rgba(255, 215, 0, 0.7),
                0 0 45px rgba(255, 215, 0, 0.6);
        }

        h2 {
            font-size: 45px;
            color: white;

            text-shadow:
                0 0 5px rgba(255, 215, 0, 0.9),
                0 0 10px rgba(255, 215, 0, 0.8),
                0 0 20px rgba(255, 215, 0, 0.7);
        }

        .btn {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            background: #FFD700;
            color: black;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #ffcc00;
            transform: scale(1.05);
        }

        /* Zonas invisibles */
        .zona {
            position: absolute;
            width: 60px;
            height: 70px;
            cursor: pointer;
        }

        /* Tooltip (nombre) */
        .tooltip {
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);

            background: rgba(0,0,0,0.8);
            color: #FFD700;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 14px;

            opacity: 0;
            transition: 0.3s;
            white-space: nowrap;
        }

        /* Mostrar al pasar el mouse */
        .zona:hover .tooltip {
            opacity: 1;
        }

    </style>
</head>

<body>
